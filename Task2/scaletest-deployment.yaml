apiVersion: apps/v1
kind: Deployment
metadata:
  name: scaletest-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scaletest_app
  template:
    metadata:
      labels:
        app: scaletest_app
    spec:
      containers:
        - name: nginx
          image: ghcr.io/yandex-practicum/scaletestapp:latest
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "100m"
              memory: "30Mi"
            limits:
              cpu: "100m"
              memory: "50Mi"

